# Secret rule pack (plan section D2).
#
# The pack is *configuration*: it tells `src/scanners/secrets.js` what to look
# for and how severe a match is. It is read by `src/core/rule-loader.js`,
# which fails closed: a malformed pack is an `E_RULES` error, never a
# silently empty rule set.
#
# Rules
#   id           lowercase slug, unique inside the pack
#   kind         provider | entropy | env_file | tracked_env
#   severity     info | low | medium | high | critical
#   pattern      regular expression (provider rules only)
#   message      what was found
#   remediation  what to do about it
#
# The patterns below are detection patterns: they are the only place in the
# kit where a provider prefix appears. `rules/**` is excluded from the scan by
# `policy/security-policy.yml`, so the pack never flags itself.
#
# The pack must never carry a literal credential shape
#   A rule pack is configuration, and configuration is read by humans: a
#   pattern is written from character classes, never from a token that could
#   be copied by accident. The guard of the repository
#   (`test/no-credential-literals.test.js`) rejects the pack - and every other
#   tracked file - that holds a credential shaped literal, a JSON Web Token
#   included.
#
# A credential class is never `medium`
#   The severity of a credential rule is `high` or `critical`: the medium
#   budget of a policy would otherwise absorb a class of secrets.

version: 1

rules:
  - id: github-pat
    kind: provider
    severity: critical
    pattern: '\bghp_[A-Za-z0-9]{36}\b'
    message: "GitHub personal access token detected"
    remediation: "Revoke the token and load it from the environment."

  - id: github-oauth
    kind: provider
    severity: critical
    pattern: '\bgho_[A-Za-z0-9]{36}\b'
    message: "GitHub OAuth access token detected"
    remediation: "Revoke the token and load it from the environment."

  - id: github-user
    kind: provider
    severity: critical
    pattern: '\bghu_[A-Za-z0-9]{36}\b'
    message: "GitHub user-to-server token detected"
    remediation: "Revoke the token and load it from the environment."

  - id: github-server
    kind: provider
    severity: critical
    pattern: '\bghs_[A-Za-z0-9]{36}\b'
    message: "GitHub server-to-server token detected"
    remediation: "Revoke the token and load it from the environment."

  - id: github-refresh
    kind: provider
    severity: critical
    pattern: '\bghr_[A-Za-z0-9]{36}\b'
    message: "GitHub refresh token detected"
    remediation: "Revoke the token and load it from the environment."

  - id: github-fine-grained-pat
    kind: provider
    severity: critical
    pattern: '\bgithub_pat_[A-Za-z0-9_]{22,}\b'
    message: "GitHub fine grained personal access token detected"
    remediation: "Revoke the token and load it from the environment."

  - id: stripe-key
    kind: provider
    severity: critical
    pattern: '\bsk_live_[A-Za-z0-9]{16,}\b'
    message: "Stripe live secret key detected"
    remediation: "Roll the key in the Stripe dashboard and load it from the environment."

  - id: vendor-secret-key
    kind: provider
    severity: critical
    pattern: '\bsk-[A-Za-z0-9]{20,}\b'
    message: "Vendor secret key detected"
    remediation: "Revoke the key and load it from the environment."

  - id: aws-access-key-id
    kind: provider
    severity: high
    pattern: '\b(?:AKIA|ASIA)[0-9A-Z]{16}\b'
    message: "AWS access key id detected"
    remediation: "Deactivate the access key in IAM and rotate the credentials."

  - id: slack-token
    kind: provider
    severity: high
    pattern: '\bxox[baprs]-[A-Za-z0-9-]{10,}\b'
    message: "Slack token detected"
    remediation: "Revoke the token in the Slack administration and rotate it."

  - id: google-api-key
    kind: provider
    severity: high
    pattern: '\bAIza[0-9A-Za-z_-]{35}\b'
    message: "Google API key detected"
    remediation: "Restrict the key in the Google console and rotate it."

  - id: private-key
    kind: provider
    severity: critical
    pattern: '-----BEGIN (RSA |EC |DSA |OPENSSH )?PRIVATE KEY-----'
    message: "Private key material detected"
    remediation: "Remove the key from the repository and rotate it."

  - id: jwt
    kind: provider
    severity: high
    # The shape of a JSON Web Token. The pattern is written from character
    # classes: the pack holds no literal token, not even as an example. The
    # header of a token is the base64 form of a JSON object, so it starts
    # with the encoding of the two bytes of "{".
    #
    # The pattern accepts every legal shape of a token:
    #   - two segments (a token without a signature) or three segments (a
    #     token with one);
    #   - a payload of one character or of none (`header..signature`);
    #   - a signature of one character (`header.payload.abc`);
    #   - the standard base64 alphabet and its padding (`=`).
    #
    # The string is the one of `src/core/jwt-shape.js` (`JWT_RULE_PATTERN`):
    # the guard of the repository and the rule of the pack must know the
    # same shape, and the build checks that they do.
    pattern: '\b[eE][yY][jJ][A-Za-z0-9_+\/=-]{5,}(?:\.[A-Za-z0-9_+\/=-]*\.[A-Za-z0-9_+\/=-]+|\.[A-Za-z0-9_+\/=-]+)'
    message: "JSON Web Token detected"
    remediation: "Do not commit tokens; issue them at runtime from a secret store."

  - id: generic-entropy
    kind: entropy
    severity: high
    message: "High entropy value assigned to a credential keyword"
    remediation: "Move the value into a secret store or an environment variable and rotate the credential."

  - id: env-file
    kind: env_file
    severity: high
    message: "Environment file present in the tree"
    remediation: "Keep environment files out of the repository and ignore them in git."

  - id: tracked-env-file
    kind: tracked_env
    severity: high
    message: "Environment file is tracked by git"
    remediation: "Remove the file from the index, rotate every credential it holds and ignore it."

# Parameters of the generic (keyword + entropy) heuristic.
entropy:
  enabled: true
  min_length: 24
  min_entropy: 4.0
  separator_pattern: '[:=]'
  require_quoted_value: true
  keywords: [apikey, api_key, api-key, secret, token, password, passwd, pwd, credential, private_key, access_key, auth_token]
  ignore_values: ["<REDACTED>", "REDACTED", "changeme", "change-me", "example", "placeholder", "xxxxx", "your_token_here", "process.env"]

# File names that are treated as environment files.
env_files:
  patterns: ['.env', '.env.*', '*.env']
  ignore: ['.env.example', '.env.sample', '.env.template', '.env.dist']

git:
  detect_tracked_env: true
